services:
  # ===========================================
  # Frontend - Next.js (Port 3000)
  # ===========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_MOODLE_URL=http://localhost:8080
      - NEXT_PUBLIC_API_URL=http://localhost:8080/webservice/rest/server.php
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - moodle
    networks:
      - lms-network

  # ===========================================
  # Moodle LMS - Apache + PHP (Port 8080)
  # ===========================================
  moodle:
    build:
      context: ./moodle
      dockerfile: Dockerfile
    container_name: lms-moodle
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - DB_TYPE=mysqli
      - DB_HOST=mysql
      - DB_NAME=moodle
      - DB_USER=moodle
      - DB_PASSWORD=moodle_password
    volumes:
      - moodledata:/var/www/moodledata
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - lms-network

  # ===========================================
  # Database - MariaDB (Port 3306)
  # ===========================================
  mysql:
    image: mariadb:10.11
    container_name: lms-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=root_password
      - MARIADB_USER=moodle
      - MARIADB_PASSWORD=moodle_password
      - MARIADB_DATABASE=moodle
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - lms-network

  # ===========================================
  # phpMyAdmin - Database Management (Port 8081)
  # ===========================================
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: lms-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=root_password
      - UPLOAD_LIMIT=100M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - lms-network

# ===========================================
# Networks
# ===========================================
networks:
  lms-network:
    driver: bridge
    name: lms-network

# ===========================================
# Volumes
# ===========================================
volumes:
  moodledata:
    name: lms-moodledata
  mysql_data:
    name: lms-mysql-data
